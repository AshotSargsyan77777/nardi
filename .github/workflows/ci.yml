name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nardi
          POSTGRES_PASSWORD: nardi
          POSTGRES_DB: nardi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nardi" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://nardi:nardi@localhost:5432/nardi_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:engine
      - run: npx prisma generate
        working-directory: apps/api
      - name: Typecheck
        run: npm run typecheck
      - name: Engine tests
        run: npm test -w @nardi/engine
      - name: API tests (ledger + end-to-end over HTTP/WebSocket)
        run: npm test -w @nardi/api
      - name: Build
        run: npm run build -w @nardi/api && npm run build -w @nardi/web
      - name: Dependency audit (informational)
        run: npm audit --omit=dev || true
