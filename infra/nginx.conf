# Reverse proxy: one public origin for the web app, REST API and WebSocket,
# so authentication cookies stay first-party. Terminate TLS here or at your load balancer.
worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  client_max_body_size 1m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Coarse edge rate limits (the API also rate-limits per route).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream web { server web:3000; }
  upstream api { server api:4000; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;  # enable with TLS

    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    location ~ ^/api/auth/(login|register|password) {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/payments/webhook/ {
      # provider IP allow-listing can be added here
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
